<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid | css</title>

    <link rel="stylesheet" href="./styles/reset.css">
    <style>
        .container {
            border: 5px solid red;
            padding: 20px;
            /* 정렬대상 item의 부모에게 명령 (flex와 동일) */
            display: grid;
            /* 1행 기준 item 크기 설정과 방향 속성 */
            /* grid-template-rows: auto 100px 50px 100px; */
            /* 1열 기준 item 크기 설정과 방향 속성 */
            /* grid-template-columns: repeat(3,1fr); */
            /* grid-template-rows: 100px 150px; */
            grid-template-areas: 
                'title title'/* 이름 연속하면 연장 처리 */
                'poster poster'
                'details reservation';
            grid-template-rows: 50px 300px 40px;
            width: 350px;
        }
        .container .item {}
        /* 각 영역에 grid 레이아웃을 위한 이름 선정 */
        .container .item:nth-child(1) {grid-area: title;}
        .container .item:nth-child(2) {grid-area: poster;}
        .container .item:nth-child(3) {grid-area: details;}
        .container .item:nth-child(4) {grid-area: reservation;}
        .container .item:nth-child(odd) {background-color: cadetblue;}
        .container .item:nth-child(even) {background-color: burlywood;}

        .container2 {
            border: 5px solid red;
            padding: 20px;
            width: 720px;

            display: grid;
            grid-template-areas: 
                'benefit benefit'
                'ad1 banner1'
                'ad2 banner1';
            grid-template-rows: 50px 400px 100px;
            /* grid-template-columns: 50px 50px 50px 50px; */
            grid-template-columns: 60% 40%;
        }
        .container2 .item {border: 5px solid red;}
        .container2 .item:nth-child(1) {grid-area: benefit;}
        .container2 .item:nth-child(2) {grid-area: ad1;}
        .container2 .item:nth-child(3) {grid-area: banner1;}
        .container2 .item:nth-child(4) {grid-area: ad2;}
        .container2 .item:nth-child(odd) {background-color: cadetblue;}
        .container2 .item:nth-child(even) {background-color: burlywood;}
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
    </div>
    <div class="container2">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
    </div>
</body>
</html>
